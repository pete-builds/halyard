[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pete-builds/halyard"
rust-version = "1.90"
publish = false

[workspace.dependencies]
halyard-term = { path = "crates/halyard-term" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# libghostty-vt-sys builds Ghostty with Zig in Debug mode whenever cargo
# reports debug info for the package (DEBUG=true), which makes the VT parser
# far slower. Build it optimized and without debug info in every profile.
[profile.dev.package.libghostty-vt-sys]
opt-level = 3
debug = false

[profile.release.package.libghostty-vt-sys]
debug = false
