[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pete-builds/halyard"
rust-version = "1.90"
publish = false

[workspace.dependencies]
halyard-term = { path = "crates/halyard-term" }

# Linux build fix for a gpui transitive dependency; see vendor/README.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
