name: nixos-vm

# Boots NixOS VMs (nix/vm-test.nix) and checks by OCR that a GPUI window
# renders under Wayland (cage) and X11 (IceWM) with software Vulkan.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nixos-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-test:
    name: NixOS VM (Wayland + X11)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Run the VM test
        run: nix build -L --no-update-lock-file --out-link result-vm .#checks.x86_64-linux.nixos-vm

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d result-vm ]; then cp result-vm/*.png screenshots/; fi
          ls -l screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nixos-vm-screenshots
          path: screenshots/
          if-no-files-found: warn
