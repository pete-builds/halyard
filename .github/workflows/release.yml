name: release

# A `v*` tag push builds the macOS app bundle and the Linux tarballs, writes SHA256SUMS,
# generates build provenance, and attaches everything to a DRAFT GitHub release. A person
# reviews the draft and publishes it. Nothing is published automatically.
#
# workflow_dispatch is a dry run: it builds the same files and uploads them as workflow
# artifacts only. It never creates a release, a tag, or an attestation. A pull request that
# touches the release path runs the same dry run, so a packaging break shows up before a tag.
#
# Build jobs stage their output in $RUNNER_TEMP/out, never in the checkout: the repo has its
# own tracked dist/ (desktop entry, icons), and staging there once shipped those folders into
# the release files (v0.1.0, run 45061752966).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - dist/**
      - nix/default.nix
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload workflow artifacts only (publishing needs a tag push)"
        type: boolean
        default: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  guard:
    name: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Refuse a non-dry run from workflow_dispatch
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "A release is only created by pushing a v* tag. Re-run with dry_run enabled." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so the tag can be checked against main
      - name: Version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$cargo_version" ]; then
            echo "cannot read the workspace version from Cargo.toml" >&2
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            # A release may only come from a commit that is already on main.
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "tag $REF_NAME points at a commit that is not on origin/main" >&2
              exit 1
            fi
            if [ "$REF_NAME" != "v$cargo_version" ]; then
              echo "tag $REF_NAME does not match Cargo.toml version $cargo_version" >&2
              echo "Bump the workspace version, merge it, then tag that commit." >&2
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal app
    needs: guard
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build Halyard.app
        run: packaging/macos/build-app.sh --out "$RUNNER_TEMP/macos"
      - name: Stage
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP"/macos/Halyard-*-macos-universal.zip "$RUNNER_TEMP/out/"
          ls -l "$RUNNER_TEMP/out"
          test "$(find "$RUNNER_TEMP/out" -mindepth 1 | wc -l)" -eq 1 \
            || { echo "expected exactly one staged file" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halyard-macos-universal
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  linux:
    name: linux ${{ matrix.arch }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        run: cargo build --release --locked -p halyard-app
      - name: Package
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="halyard-${VERSION}-linux-${ARCH}"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/$name"
          # The release profile keeps line tables (debug = "line-tables-only"), which makes
          # the binary about 93 MB. Strip it for the tarball.
          install -m 755 target/release/halyard "$out/$name/halyard"
          strip "$out/$name/halyard"
          cp packaging/linux/README.txt LICENSE-MIT LICENSE-APACHE "$out/$name/"
          tar -C "$out" -czf "$out/$name.tar.gz" "$name"
          rm -rf "${out:?}/${name:?}"
          ls -l "$out"
          test "$(find "$out" -mindepth 1 | wc -l)" -eq 1 \
            || { echo "expected exactly one staged file" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halyard-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  checksums:
    name: checksums and provenance
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # sign the provenance with the workflow's OIDC identity
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: halyard-*
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          # Only regular files belong in a release; a directory here means a build job
          # staged the wrong thing.
          if [ -n "$(find . -mindepth 1 ! -type f)" ]; then
            find . -mindepth 1 ! -type f >&2
            echo "release files must be regular files" >&2
            exit 1
          fi
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3 || { echo "expected 3 files to sum" >&2; exit 1; }
      - name: Build provenance
        # Skipped on a dry run: an attestation is a permanent public record.
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  publish:
    name: draft release
    # Only a tag push creates a release, and only as a draft.
    if: github.event_name == 'push'
    needs: checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Draft. Read docs/INSTALL.md before publishing. The macOS app is ad-hoc signed and
            NOT notarized. Verify downloads with SHA256SUMS, and provenance with
            `gh attestation verify <file> -R pete-builds/halyard`.
