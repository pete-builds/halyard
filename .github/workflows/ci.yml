name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          # A run cancelled mid-build (cancel-in-progress) still saved a half-written Zig
          # cache, and every later run restored it ("not an ELF file" on libc++.a). The
          # Ghostty build takes about 25s uncached, so do not cache it.
          use-cache: false
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            vim less htop zsh fish
      - name: macOS test tools
        if: runner.os == 'macOS'
        run: brew install htop fish
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Throughput smoke test
        # Loose floors that catch a large regression, not a benchmark (docs/PERFORMANCE.md).
        run: cargo run --release --locked -p halyard-term --example throughput -- --quick
      - name: Vendored patches build against current dependencies
        # Upstream code: lints are capped for dependencies in the real build, so do not
        # promote its deprecation warnings to errors here.
        env:
          RUSTFLAGS: ""
        run: cargo check --manifest-path vendor/xattr/Cargo.toml

  ui:
    # A real window driven by the debug-script harness (scripts/ui-check.sh):
    # keyboard focus after tab clicks and in-place renames, right-click routing.
    # Unit tests cannot see these (docs/testing.md).
    name: window scripts (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ui
      - name: Window scripts
        run: scripts/ui-check.sh

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check licenses advisories bans sources
