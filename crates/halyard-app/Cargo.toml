[package]
name = "halyard-app"
description = "The Halyard terminal application: GPUI windows, rendering and input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "halyard"
path = "src/main.rs"

[dependencies]
futures = "0.3"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
halyard-agents = { path = "../halyard-agents" }
halyard-config = { path = "../halyard-config" }
halyard-ipc = { path = "../halyard-ipc" }
halyard-shell = { path = "../halyard-shell" }
halyard-term.workspace = true
halyard-workspace = { path = "../halyard-workspace" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Desktop notifications through the freedesktop interface (D-Bus). zbus 5 is
# already in the Linux build through GPUI's portal crate (ashpd); this adds only
# its blocking API, no new crates.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"

[features]
# Debug-only scripted driving and window screenshots (HALYARD_DEBUG_SCRIPT),
# used to verify the window on machines with no one at the keyboard.
debug-script = ["dep:core-graphics", "dep:png", "dep:raw-window-handle"]

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", optional = true }
# Desktop notifications (NSUserNotificationCenter) and the debug-script driver.
objc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies.png]
version = "0.18"
optional = true

[dependencies.raw-window-handle]
version = "0.6"
optional = true

[lints]
workspace = true
