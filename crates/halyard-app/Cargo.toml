[package]
name = "halyard-app"
description = "The Halyard terminal application: GPUI windows, rendering and input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "halyard"
path = "src/main.rs"

[dependencies]
futures = "0.3"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
halyard-term.workspace = true

[features]
# Debug-only scripted driving and window screenshots (HALYARD_DEBUG_SCRIPT),
# used to verify the window on machines with no one at the keyboard.
debug-script = ["dep:core-graphics", "dep:objc", "dep:png", "dep:raw-window-handle"]

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", optional = true }
objc = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies.png]
version = "0.18"
optional = true

[dependencies.raw-window-handle]
version = "0.6"
optional = true

[lints]
workspace = true
